name: mfdiag
on: push
jobs:
  diag:
    runs-on: windows-2022
    steps:
      - shell: pwsh
        run: |
          $um = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\um"
          function FindLine([string]$f, [string]$pat) {
              if (-not (Test-Path $f)) { return 0 }
              $o = & findstr /n /c:$pat $f 2>$null
              if ($LASTEXITCODE -eq 0 -and $o) { return [int]((($o | Select-Object -First 1) -split ':')[0]) }
              return 0
          }
          function Show([string]$f, [int]$ln, [int]$b, [int]$a) {
              if ($ln -eq 0) { Write-Output "    (not found)"; return }
              $lines = Get-Content $f
              $s = [Math]::Max(0, $ln-1-$b); $e = [Math]::Min($lines.Count-1, $ln-1+$a)
              for ($i=$s; $i -le $e; $i++) { Write-Output ("    L{0}: {1}" -f ($i+1), $lines[$i]) }
          }
          $mfidl = Join-Path $um "mfidl.h"
          $mfapi = Join-Path $um "mfapi.h"
          $mfor  = Join-Path $um "mfobjects.h"
          $mfrw  = Join-Path $um "mfreadwrite.h"

          Write-Output "### IMFByteStream (anchor IsCurrentPositionSupported) ###"
          foreach ($f in @($mfidl,$mfapi)) {
              $ln = FindLine $f "IsCurrentPositionSupported"
              if ($ln) { Write-Output ("  " + (Split-Path $f -Leaf) + " L$ln"); Show $f $ln 15 3; break }
          }
          Write-Output "### MF_SEEK_ORIGIN ###"
          foreach ($f in @($mfapi,$mfidl)) { $ln = FindLine $f "MF_SEEK_ORIGIN"; if ($ln) { Write-Output ("  " + (Split-Path $f -Leaf) + " L$ln"); Show $f $ln 2 6; break } }
          Write-Output "### MFStreamStatus ###"
          foreach ($f in @($mfapi,$mfidl)) { $ln = FindLine $f "MFStreamStatus"; if ($ln) { Write-Output ("  " + (Split-Path $f -Leaf) + " L$ln"); Show $f $ln 2 8; break } }
          Write-Output "### IMFSourceReader (anchor SetCurrentMediaType, +50) ###"
          $ln = FindLine $mfrw "SetCurrentMediaType"
          Show $mfrw $ln 2 52
          Write-Output "### IMFDXGIDeviceManager (anchor OpenDeviceFromUnknown) ###"
          foreach ($f in @($mfapi,$mfidl,$mfor)) { $ln = FindLine $f "OpenDeviceFromUnknown"; if ($ln) { Write-Output ("  " + (Split-Path $f -Leaf) + " L$ln"); Show $f $ln 9 3; break } }
