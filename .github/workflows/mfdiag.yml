name: mfdiag
on: push
jobs:
  diag:
    runs-on: windows-2022
    steps:
      - shell: pwsh
        run: |
          $um = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\um"
          $hs = @("mfapi.h","mfobjects.h","mfidl.h","mfreadwrite.h","mferror.h")
          function DumpDef([string]$rx, [int]$a) {
              foreach ($h in $hs) {
                  $f = Join-Path $um $h
                  if (-not (Test-Path $f)) { continue }
                  $lines = Get-Content $f
                  for ($i=0; $i -lt $lines.Count; $i++) {
                      if ($lines[$i] -match $rx) {
                          Write-Output ("  === DEF $h @ L$($i+1) ===")
                          $e = [Math]::Min($lines.Count-1, $i+$a)
                          for ($j=$i; $j -le $e; $j++) { Write-Output ("    L{0}: {1}" -f ($j+1), $lines[$j]) }
                          return
                      }
                  }
              }
              Write-Output "  (definition of '$rx' not found in any MF header)"
          }
          Write-Output "### where is IMFByteStream? (all refs) ###"
          foreach ($h in $hs) {
              $f = Join-Path $um $h
              if (-not (Test-Path $f)) { continue }
              $lines = Get-Content $f
              for ($i=0; $i -lt $lines.Count; $i++) {
                  if ($lines[$i] -match "IMFByteStream") { Write-Output ("  {0} L{1}: {2}" -f $h, ($i+1), $lines[$i].Trim()) }
              }
          }
          Write-Output "### IMFByteStream definition (+20) ###"
          DumpDef "IMFByteStream\s*:" 20
          Write-Output "### MF_SEEK_ORIGIN enum (+6) ###"
          DumpDef "MF_SEEK_ORIGIN" 6
          Write-Output "### MFStreamStatus enum (+8) ###"
          DumpDef "MFStreamStatus" 8
          Write-Output "### IMFDXGIDeviceManager definition (+16) ###"
          DumpDef "IMFDXGIDeviceManager\s*:" 16
