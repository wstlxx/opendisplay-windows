name: mfdiag
on: push
jobs:
  diag:
    runs-on: windows-2022
    steps:
      - shell: pwsh
        run: |
          $v = "10.0.26100.0"
          $um = "C:\Program Files (x86)\Windows Kits\10\Include\$v\um"
          $rw = Join-Path $um "mfreadwrite.h"
          $api = Join-Path $um "mfapi.h"

          Write-Output "##### mfreadwrite.h: all MIDL_INTERFACE lines #####"
          Select-String -Path $rw -Pattern "MIDL_INTERFACE" | ForEach-Object { Write-Output ("  L{0}: {1}" -f $_.LineNumber, $_.Line.Trim()) }

          Write-Output "##### mfreadwrite.h: lines containing 'Reader' (first 40) #####"
          Select-String -Path $rw -Pattern "Reader" | Select-Object -First 40 | ForEach-Object { Write-Output ("  L{0}: {1}" -f $_.LineNumber, $_.Line.Trim()) }

          Write-Output "##### mfreadwrite.h: lines containing 'MediaSource' (first 30) #####"
          Select-String -Path $rw -Pattern "MediaSource" | Select-Object -First 30 | ForEach-Object { Write-Output ("  L{0}: {1}" -f $_.LineNumber, $_.Line.Trim()) }

          Write-Output "##### mfreadwrite.h: FIRST 3 lines #####"
          Get-Content $rw -TotalCount 3 | ForEach-Object { Write-Output "  $_" }
          Write-Output "##### mfreadwrite.h: LAST 12 lines #####"
          Get-Content $rw -Tail 12 | ForEach-Object { Write-Output "  $_" }

          Write-Output "##### mfapi.h: lines with StreamStatus/SEEK/DECODE_TO (first 20) #####"
          Select-String -Path $api -Pattern "StreamStatus|SEEK|DECODE_TO_DISPLAY" | Select-Object -First 20 | ForEach-Object { Write-Output ("  L{0}: {1}" -f $_.LineNumber, $_.Line.Trim()) }

          Write-Output "##### mfapi.h: LAST 8 lines #####"
          Get-Content $api -Tail 8 | ForEach-Object { Write-Output "  $_" }

          Write-Output "##### does mfreadwrite.h include anything? (include lines) #####"
          Select-String -Path $rw -Pattern "#include" | ForEach-Object { Write-Output ("  L{0}: {1}" -f $_.LineNumber, $_.Line.Trim()) }
