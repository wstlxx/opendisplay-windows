name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # Platform-independent protocol layer: build + unit tests + a real
  # cross-language integration test (C++ receiver over TCP vs Python sender).
  protocol:
    name: protocol (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + run protocol unit tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -I. \
            protocol/*.cpp tests/test_protocol.cpp -o /tmp/test_protocol
          /tmp/test_protocol

      - name: Build fake_receiver + sim_sender integration test
        run: |
          set -e
          g++ -std=c++20 -O2 -Wall -Wextra -I. \
            protocol/*.cpp tools/fake_receiver.cpp -o /tmp/fake_receiver
          /tmp/fake_receiver --port 9127 --seconds 8 > /tmp/fr.log 2>&1 &
          FID=$!
          sleep 0.8
          timeout 8 python3 tools/sim_sender.py \
            --port 9127 --file tests/data/sample.h264 || true
          wait "$FID" || true
          cat /tmp/fr.log
          grep -q "RESULT: PASS" /tmp/fr.log

  # Windows-only layer (net/video/render/app): configure + build with MSVC.
  # This is a compile-only gate (no headless MF/D3D run), but it catches the
  # real Windows compile errors the Linux box cannot surface.
  windows:
    name: windows build (MSVC)
    # windows-latest (the 2025 image, MSBuild 18 / SDK 10.0.26100) ships a
    # broken/inconsistent Media Foundation SDK: mfapi.h is truncated after
    # MFCreateAttributes and mfreadwrite.h is effectively empty, so
    # IMFMediaSourceReader / MFCreateMediaSourceReader / MF_DECODE_TO_DISPLAY /
    # MFStreamStatus / MF_SEEK_ORIGIN are all missing (see od_mf_diag). The
    # stable 2022 image has a healthy SDK.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Inspect SDK Media Foundation headers
        shell: pwsh
        run: |
          $dirs = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory |
                  Where-Object { $_.Name -match '^10\.0\.' }
          $inc = ($dirs | Sort-Object Name | Select-Object -Last 1).FullName + '\um'
          Write-Host "Using SDK UM include: $inc"
          foreach ($f in 'mfapi.h','mfobjects.h','mfidl.h','mfreadwrite.h','mferror.h') {
            $p = Join-Path $inc $f
            if (Test-Path $p) { Write-Host ("  {0}: {1} bytes" -f $f, (Get-Item $p).Length) }
            else { Write-Host ("  {0}: MISSING" -f $f) }
          }
          Write-Host "--- grep mfapi.h (expect MFStreamStatus / MF_DECODE_TO_DISPLAY / MF_SEEK_ORIGIN / MFCreateAttributes) ---"
          Select-String -Path (Join-Path $inc 'mfapi.h') -Pattern 'MFStreamStatus|MF_DECODE_TO_DISPLAY|MF_SEEK_ORIGIN|MF_ATTRIBUTE_VALUE_TYPE|MFCreateAttributes|MF_MT_DEFAULT_CROP' | Select-Object -First 10 | ForEach-Object { '  ' + $_.LineNumber + ': ' + $_.Line.Trim() }
          Write-Host "--- grep mfreadwrite.h (expect IMFMediaSourceReader / MFCreateMediaSourceReader) ---"
          Select-String -Path (Join-Path $inc 'mfreadwrite.h') -Pattern 'IMFMediaSourceReader|MFCreateMediaSourceReader|MFCreateMediaSourceFromByteStream' | Select-Object -First 10 | ForEach-Object { '  ' + $_.LineNumber + ': ' + $_.Line.Trim() }

      - name: Build MF/D3D diagnostic (SDK sanity check)
        run: cmake --build build --config Release --target od_mf_diag

      - name: Build full app (Release)
        run: cmake --build build --config Release
