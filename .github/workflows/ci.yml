name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # Platform-independent protocol layer: build + unit tests + a real
  # cross-language integration test (C++ receiver over TCP vs Python sender).
  protocol:
    name: protocol (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + run protocol unit tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -I. \
            protocol/*.cpp app/config.cpp tests/test_protocol.cpp -o /tmp/test_protocol
          /tmp/test_protocol

      - name: Build fake_receiver + sim_sender integration test
        run: |
          set -e
          g++ -std=c++20 -O2 -Wall -Wextra -I. \
            protocol/*.cpp tools/fake_receiver.cpp -o /tmp/fake_receiver
          /tmp/fake_receiver --port 9127 --seconds 8 > /tmp/fr.log 2>&1 &
          FID=$!
          sleep 0.8
          timeout 8 python3 tools/sim_sender.py \
            --port 9127 --file tests/data/sample.h264 || true
          wait "$FID" || true
          cat /tmp/fr.log
          grep -q "RESULT: PASS" /tmp/fr.log

  # Windows-only layer: the full app is built with MSVC -- od_net (Winsock),
  # od_video (Media Foundation decode), od_render (D3D11), and
  # opendisplay_receiver. The protocol unit tests run too, and the receiver
  # exe is uploaded as an artifact.
  windows:
    name: windows build (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build the full app + tests (Release)
        run: >
          cmake --build build --config Release
          --target opendisplay_receiver --target od_tests

      - name: Run protocol unit tests on Windows
        run: build\Release\od_tests.exe

      - name: Stage artifact (exe + test sender + sample stream)
        run: |
          New-Item -ItemType Directory -Force build/dist | Out-Null
          Copy-Item build/Release/opendisplay_receiver.exe build/dist/
          Copy-Item config.ini build/dist/
          Copy-Item tools/sim_sender.py build/dist/
          Copy-Item tests/data/sample.h264 build/dist/sample.h264

      - name: Upload the receiver + test tools
        uses: actions/upload-artifact@v4
        with:
          name: opendisplay_receiver
          path: build/dist
