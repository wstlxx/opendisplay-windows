name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # Platform-independent protocol layer: build + unit tests + a real
  # cross-language integration test (C++ receiver over TCP vs Python sender).
  protocol:
    name: protocol (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + run protocol unit tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -I. \
            protocol/*.cpp tests/test_protocol.cpp -o /tmp/test_protocol
          /tmp/test_protocol

      - name: Build fake_receiver + sim_sender integration test
        run: |
          set -e
          g++ -std=c++20 -O2 -Wall -Wextra -I. \
            protocol/*.cpp tools/fake_receiver.cpp -o /tmp/fake_receiver
          /tmp/fake_receiver --port 9127 --seconds 8 > /tmp/fr.log 2>&1 &
          FID=$!
          sleep 0.8
          timeout 8 python3 tools/sim_sender.py \
            --port 9127 --file tests/data/sample.h264 || true
          wait "$FID" || true
          cat /tmp/fr.log
          grep -q "RESULT: PASS" /tmp/fr.log

  # Windows-only layer (net/video/render/app): configure + build with MSVC.
  # This is a compile-only gate (no headless MF/D3D run), but it catches the
  # real Windows compile errors the Linux box cannot surface.
  windows:
    name: windows build (MSVC)
    # windows-latest (the 2025 image, MSBuild 18 / SDK 10.0.26100) ships a
    # broken/inconsistent Media Foundation SDK: mfapi.h is truncated after
    # MFCreateAttributes and mfreadwrite.h is effectively empty, so
    # IMFMediaSourceReader / MFCreateMediaSourceReader / MF_DECODE_TO_DISPLAY /
    # MFStreamStatus / MF_SEEK_ORIGIN are all missing (see od_mf_diag). The
    # stable 2022 image has a healthy SDK.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (force a healthy Windows SDK)
        shell: pwsh
        run: |
          cmake -B build
          # The VS generator auto-selects the newest SDK (10.0.26100.0), whose
          # Media Foundation headers are broken (mfreadwrite.h lacks
          # IMFMediaSourceReader & co.). Force every generated project to target
          # a known-good SDK instead.
          $want = '10.0.19041.0'
          $files = @(Get-ChildItem build -Filter *.vcxproj -Recurse -ErrorAction SilentlyContinue)
          Write-Host ("Found " + $files.Count + " vcxproj files:")
          $files | ForEach-Object { Write-Host ("  " + $_.FullName) }
          foreach ($f in $files) {
            $c = Get-Content $f.FullName -Raw
            $c = $c -replace '<WindowsTargetPlatformVersion>[^<]*</WindowsTargetPlatformVersion>',
                ('<WindowsTargetPlatformVersion>' + $want + '</WindowsTargetPlatformVersion>')
            Set-Content -Path $f.FullName -Value $c -NoNewline
          }

      - name: Inspect SDK Media Foundation headers
        shell: pwsh
        run: |
          $base = 'C:\Program Files (x86)\Windows Kits\10\Include'
          $vers = Get-ChildItem $base -Directory | Where-Object { $_.Name -match '^10\.0\.' } | ForEach-Object { $_.Name } | Sort-Object
          Write-Host ("Installed SDK versions: " + ($vers -join ', '))
          Write-Host ""
          foreach ($v in $vers) {
            $rw = Join-Path (Join-Path (Join-Path $base $v) 'um') 'mfreadwrite.h'
            $mf = Join-Path (Join-Path (Join-Path $base $v) 'um') 'mfapi.h'
            $nReader = 0; $nStream = 0
            if (Test-Path $rw) { $nReader = (Select-String -Path $rw -Pattern 'IMFMediaSourceReader' | Measure-Object).Count }
            if (Test-Path $mf) { $nStream = (Select-String -Path $mf -Pattern 'MFStreamStatus' | Measure-Object).Count }
            Write-Host ("  {0}: mfreadwrite.h IMFMediaSourceReader={1}, mfapi.h MFStreamStatus={2}" -f $v, $nReader, $nStream)
          }
          Write-Host ""
          Write-Host "=== first 25 lines of 26100.0 mfreadwrite.h ==="
          Get-Content (Join-Path (Join-Path (Join-Path $base '10.0.26100.0') 'um') 'mfreadwrite.h') -TotalCount 25 | ForEach-Object { '  | ' + $_ }

      - name: Build MF/D3D diagnostic (SDK sanity check)
        run: cmake --build build --config Release --target od_mf_diag

      - name: Build full app (Release)
        run: cmake --build build --config Release
