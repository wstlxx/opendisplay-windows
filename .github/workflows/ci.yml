name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # Platform-independent protocol layer: build + unit tests + a real
  # cross-language integration test (C++ receiver over TCP vs Python sender).
  protocol:
    name: protocol (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + run protocol unit tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -I. \
            protocol/*.cpp tests/test_protocol.cpp -o /tmp/test_protocol
          /tmp/test_protocol

      - name: Build fake_receiver + sim_sender integration test
        run: |
          set -e
          g++ -std=c++20 -O2 -Wall -Wextra -I. \
            protocol/*.cpp tools/fake_receiver.cpp -o /tmp/fake_receiver
          /tmp/fake_receiver --port 9127 --seconds 8 > /tmp/fr.log 2>&1 &
          FID=$!
          sleep 0.8
          timeout 8 python3 tools/sim_sender.py \
            --port 9127 --file tests/data/sample.h264 || true
          wait "$FID" || true
          cat /tmp/fr.log
          grep -q "RESULT: PASS" /tmp/fr.log

  # Windows-only layer. The Media Foundation / D3D11 decode+render targets
  # (od_video, od_render, opendisplay_receiver) CANNOT be compiled on GitHub's
  # hosted Windows runners: every installed Windows SDK there ships a broken /
  # incomplete Media Foundation header set (mfreadwrite.h lacks IMFMediaSource
  # Reader & friends; mfapi.h lacks MFStreamStatus / MF_SEEK_ORIGIN / ...), and
  # the compiler's include path stays pinned to the newest SDK regardless of
  # the vcxproj WindowsTargetPlatformVersion. Those targets therefore require a
  # local Windows build (see README "Building the app").
  #
  # What we DO gate on Windows: the protocol layer and the Winsock networking
  # layer compile with MSVC, and the protocol unit tests run on Windows.
  windows:
    name: windows build (MSVC, protocol + net)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build protocol + net + tests (Release)
        run: >
          cmake --build build --config Release
          --target od_net --target od_tests

      - name: Run protocol unit tests on Windows
        run: build\Release\od_tests.exe
