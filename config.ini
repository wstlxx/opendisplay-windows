; Copy this file beside opendisplay_receiver.exe and restart after editing.
[display]
width = 1280
height = 720
fullscreen = false
; true: resize the Mac virtual display in 25% steps when the video area changes.
; Live size changes make the current Mac sender rebuild capture and may pause video.
; false: scale the existing stream inside the window.
adaptive_resolution = false

[video]
; Requested H.264 bitrate in kbps. Current official Mac senders ignore this
; optional hello field and use their own quality preset.
bitrate_kbps = 18000
